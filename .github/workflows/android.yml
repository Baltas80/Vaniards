name: Vaniards Android Build

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 36 SDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          else
            export PATH="$ANDROID_HOME/cmdline-tools/16.0/bin:$ANDROID_HOME/platform-tools:$PATH"
          fi
          command -v sdkmanager
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Assemble GDevelop project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/source game
          cat game/source/Vaniards.json.part* > game/Vaniards.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("game/Vaniards.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          data.setdefault("properties", {})["latestCompilationDirectory"] = str(Path("build/html5").resolve())
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding="utf-8")
          print("Project JSON valid:", p.stat().st_size, "bytes")
          PY

      - name: Prepare official GDevelop multitouch extension
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .gdevelop-reference game/assets
          curl -L --fail --retry 3 -o .gdevelop-reference/starting-platformer.json \
            "https://raw.githubusercontent.com/GDevelopApp/GDevelop-examples/2f42a1c2138f401facb6c801711b5cdcb1b53c84/examples/starting-platformer/starting-platformer.json"
          python3 - <<'PY'
          import json, struct, zlib
          from pathlib import Path

          out = Path("game/assets/vaniards_touch_transparent.png")
          def chunk(kind, data):
              return struct.pack(">I", len(data)) + kind + data + struct.pack(">I", zlib.crc32(kind + data) & 0xffffffff)
          raw = b"\x00\x00\x00\x00" + b"\x00\x00\x00\x00"
          png = (
              b"\x89PNG\r\n\x1a\n" +
              chunk(b"IHDR", struct.pack(">IIBBBBB", 2, 2, 8, 6, 0, 0, 0)) +
              chunk(b"IDAT", zlib.compress(raw)) +
              chunk(b"IEND", b"")
          )
          out.write_bytes(png)
          json.loads(Path(".gdevelop-reference/starting-platformer.json").read_text(encoding="utf-8"))
          print("Reference project + transparent joystick asset ready.")
          PY

      - name: Install official SpriteMultitouchJoystick controls
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch_mobile_controls_official.py game/Vaniards.json .gdevelop-reference/starting-platformer.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("game/Vaniards.json").read_text(encoding="utf-8"))
          stage = next(s for s in data["layouts"] if s.get("name") == "Stage")
          ext = [e for e in data.get("eventsFunctionsExtensions", []) if e.get("name") == "SpriteMultitouchJoystick"]
          hero = next(o for o in stage["objects"] if o.get("name") == "HeroHitbox")
          assert len(ext) == 1
          assert any(o.get("name") == "MoveJoystick" and o.get("type") == "SpriteMultitouchJoystick::SpriteMultitouchJoystick" for o in stage["objects"])
          assert not any(b.get("type") == "SpriteMultitouchJoystick::PlatformerMultitouchMapper" for b in hero.get("behaviors", []))
          names = {e.get("name") for e in stage.get("events", [])}
          assert "Mobile Joystick Movement" in names
          for name in ("TouchJump", "TouchAttack", "TouchDash"):
              obj = next(o for o in stage["objects"] if o.get("name") == name)
              assert any(b.get("type") == "SpriteMultitouchJoystick::MultitouchButton" for b in obj.get("behaviors", []))
          assert Path("game/assets/vaniards_touch_transparent.png").exists()
          print("Multitouch extension + independent joystick movement validated.")
          PY

      - name: Recover game assets from reference APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p game/assets .apk
          unzip -q "Vaniards - Copy-1_0_1.apk" 'assets/www/*' -d .apk
          find .apk/assets/www -maxdepth 1 -type f \
            \( -name '*.png' -o -name '*.jpg' -o -name '*.jpeg' -o -name '*.ogg' -o -name '*.wav' -o -name '*.ttf' -o -name '*.fnt' -o -name '*.json' \) \
            -exec cp -f {} game/assets/ \;
          test -f game/assets/Level1.json
          echo "Recovered assets: $(find game/assets -maxdepth 1 -type f | wc -l)"

      - name: Download GDevelop 5.6.282
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o gdevelop.AppImage \
            "https://github.com/4ian/GDevelop/releases/download/v5.6.282/GDevelop-5-5.6.282.AppImage"
          chmod +x gdevelop.AppImage

      - name: Export GDevelop HTML5
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/html5
          xvfb-run -a ./gdevelop.AppImage --appimage-extract-and-run --no-sandbox --disable-gpu --disable-update-check \
            --run-command EXPORT_HTML5_EXTERNAL "$PWD/game/Vaniards.json"
          test -f build/html5/index.html
          echo "HTML5 export completed."

      - name: Inject joystick-style mobile visuals
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/inject_mobile_controls_overlay.py build/html5/index.html
          grep -q "vaniards-mobile-controls" build/html5/index.html
          echo "Mobile joystick overlay injected."

      - name: Prepare Cordova Android shell
        shell: bash
        run: |
          set -euo pipefail
          npm install --global cordova@13.0.0
          cordova create android-build com.baltas80.vaniards Vaniards
          cp -a build/html5/. android-build/www/
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android-build/config.xml")
          s = p.read_text(encoding="utf-8")
          s = s.replace("</widget>", '''  <preference name="Orientation" value="landscape" />
            <preference name="Fullscreen" value="true" />
            <preference name="android-minSdkVersion" value="23" />
            <preference name="android-targetSdkVersion" value="36" />
            <preference name="android-compileSdkVersion" value="36" />
          </widget>''')
          p.write_text(s, encoding="utf-8")
          PY
          cd android-build
          cordova platform add android@15.1.0
          cordova requirements

      - name: Build tactile APK
        shell: bash
        run: |
          set -euo pipefail
          cd android-build
          cordova build android --debug
          test -f platforms/android/app/build/outputs/apk/debug/app-debug.apk
          cp platforms/android/app/build/outputs/apk/debug/app-debug.apk ../Vaniards-touch-1.0.1-debug.apk

      - name: Build unsigned release AAB
        shell: bash
        run: |
          set -euo pipefail
          cd android-build
          cordova build android --release || true
          AAB=$(find platforms/android/app/build/outputs -type f -name '*.aab' | head -n 1 || true)
          if [ -n "$AAB" ]; then cp "$AAB" ../Vaniards-1.0.1-unsigned.aab; fi

      - name: Sign release AAB
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEY_PASSWORD != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > upload-keystore.jks
          jarsigner -keystore upload-keystore.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" -keypass "$ANDROID_KEY_PASSWORD" -signedjar Vaniards-1.0.1.aab Vaniards-1.0.1-unsigned.aab "$ANDROID_KEY_ALIAS"
          jarsigner -verify -strict Vaniards-1.0.1.aab
          rm -f upload-keystore.jks

      - name: Publish Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Vaniards-Android-1.0.1
          if-no-files-found: error
          path: |
            Vaniards-touch-1.0.1-debug.apk
            Vaniards-1.0.1-unsigned.aab
            Vaniards-1.0.1.aab
